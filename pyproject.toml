[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "Hindi/English clinic-booking voice agent with a caller simulator that gates regressions in CI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=3.58,<4",
    "pydantic>=2.14,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-cov>=5",
]
gpu = [
    "faster-whisper>=1.2.1",
    "pocket-tts",
    "vllm==0.19.1",
]

[tool.uv]
package = false
# uv-managed CPython (same build as CI) ships Python.h, which Triton needs to start vLLM;
# the system /usr/bin/python3.11 has no dev headers.
python-preference = "only-managed"

[tool.uv.sources]
pocket-tts = { git = "https://github.com/kyutai-labs/pocket-tts", rev = "0c2db3bdea7c991c568989cc11b503f14483fabc" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "DTZ"]  # DTZ: forbid naive datetimes

[tool.pyright]
include = ["agent", "clinic", "sim", "bench", "ci", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: needs the RTX 4060 (skipped on GitHub-hosted CI)"]
