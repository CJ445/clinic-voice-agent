[project]
name = "clinic-voice-agent"
version = "0.1.0"
description = "Hindi/English clinic-booking voice agent with a caller simulator that gates regressions in CI"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "DTZ"]  # DTZ: forbid naive datetimes

[tool.pyright]
include = ["agent", "clinic", "sim", "bench", "ci", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: needs the RTX 4060 (skipped on GitHub-hosted CI)"]
